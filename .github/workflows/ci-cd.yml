name: SDASA — Validação e pacote de entrega

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node scripts/security-check.js
      - run: npm audit --audit-level=high
      - name: Relatório de navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Preparar pacote de execução
        run: |
          mkdir -p dist/scripts
          cp -r server shared js css docs dist/
          cp index.html package.json package-lock.json README.md DEVOPS.md PLANEJAMENTO.md Dockerfile .env.example dist/
          cp scripts/create-admin.js scripts/backup.js scripts/restore.js scripts/demo.js dist/scripts/
      - name: Pacote de entrega — hospedagem Node necessária
        uses: actions/upload-artifact@v4
        with:
          name: sdasa-app
          path: dist/
          include-hidden-files: true
          retention-days: 14
